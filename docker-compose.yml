version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: gymguy
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gymbase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymguy -d gymbase"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gymguy:gym@db:5432/gymbase
    ports:
      - "8000:8000"

volumes:
  postgres_data: